[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gyntoolkit"
version = "2.0.0"
description = "Canivete suíço de pentest — recon, port scan, CVE lookup e brute force."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PH" },
    { name = "Fl4vs" },
]
keywords = ["security", "pentest", "reconnaissance", "port-scanner", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "colorama>=0.4.6",
    "requests>=2.32.0",
    "python-whois>=0.9.4",
    "dnspython>=2.6.1",
    "scapy>=2.5.0",
    "paramiko>=3.4.0",
    "aiohttp>=3.10.0",
    "cryptography>=42.0.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
]

[project.scripts]
gyntoolkit = "gyntoolkit.cli:main_entry"

[project.urls]
Homepage = "https://github.com/flavsjr/gyntoolkit"
Repository = "https://github.com/flavsjr/gyntoolkit"
"Issue Tracker" = "https://github.com/flavsjr/gyntoolkit/issues"

[tool.setuptools]
packages = ["gyntoolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# cupp/ is vendored third-party code (github.com/Mebus/cupp); not linted here.
extend-exclude = ["cupp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
