[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gyntoolkit"
version = "1.3.0"
description = "Canivete suíço de pentest — recon, port scan, CVE lookup e brute force."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PH" },
    { name = "Fl4vs" },
]
keywords = ["pentest", "security", "recon", "portscan", "cve"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "colorama>=0.4.6",
    "requests>=2.32.0",
    "python-whois>=0.9.4",
    "dnspython>=2.6.1",
    "scapy>=2.5.0",
    "paramiko>=3.4.0",
    "aiohttp>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
]

[project.scripts]
gyntoolkit = "gyntoolkit:main_entry"

[project.urls]
Homepage = "https://github.com/flavsjr/gyntoolkit"
Issues = "https://github.com/flavsjr/gyntoolkit/issues"

[tool.setuptools]
py-modules = ["gyntoolkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
