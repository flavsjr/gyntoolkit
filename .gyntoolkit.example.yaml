# GynToolkit — configuração de exemplo.
# Copie para `.gyntoolkit.yaml` (na raiz ou no diretório de execução) e ajuste.
# Só declare as chaves que quiser sobrescrever; o resto usa os defaults.
# Também dá para apontar um caminho via env: GYNTOOLKIT_CONFIG=/path/config.yaml

scan:
  default_type: "fast"          # "fast" (top 21 portas) ou "full" (1-65535)
  concurrency: 100               # sondas simultâneas (limita o full scan)

brute:
  ssh_workers: 8
  http_workers: 10
  delay: 0.1                     # segundos entre tentativas por worker
  ssh_timeout: 5
  http_timeout: 10
  users_wordlist: ""             # path default sugerido no prompt (ex: lab/wordlists/users.txt)
  passwords_wordlist: ""         # ex: lab/wordlists/passwords.txt

recon:
  subdomain_timeout: 30
  ssl_timeout: 8
  http_timeout: 10
  traceroute_max_hops: 20
  traceroute_dport: 80

ui:
  lang: "auto"                   # idioma da UI: auto | en | pt
                                 # auto = env GYNTOOLKIT_LANG > locale do SO > en

export:
  dir: "reports"                 # diretório de saída dos relatórios
  auto: false                    # true = exporta sem perguntar
  format: "json"                 # formato quando auto=true: json | html | csv | md

api_keys:
  hibp: ""                       # reservado (endpoints atuais são públicos)
  shodan: ""
  nvd: ""                        # opcional: eleva o rate-limit do CVE lookup (NVD)
