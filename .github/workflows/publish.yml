name: publish

# Publica no PyPI quando um GitHub Release é publicado.
# Usa Trusted Publishing (OIDC) — nenhum token/secret é armazenado no repo.
# Pré-requisito único (feito na web): cadastrar este repo como trusted
# publisher do projeto "gyntoolkit" em https://pypi.org/manage/account/publishing/
# (workflow: publish.yml, environment: pypi).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gyntoolkit/
    permissions:
      id-token: write   # necessário para Trusted Publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
